    <script>
      // Statistical Purposes Exception - 1
      function speRewrite(button) {
        var clone = button.cloneNode(true);
        console.log("[OneTrust] speRewrite called");
        button.parentNode.replaceChild(clone, button);
        clone.addEventListener('click', function() {
          OneTrust.UpdateConsent("Category", "C0014:1");
        });
      }
      // Standard OneTrust Callback
      function OptanonWrapper() {
        console.log("[OneTrust] Loaded");
        initRejectRewrite();
      }
      // Statistical Purposes Exception - 2
      function initRejectRewrite() {
        if (window._otRejectInit) return;
        window.otRejectInit = true;

        if (typeof OneTrust === "undefined" || OneTrust.IsAlertBoxClosed() ) return;

        const id = "onetrust-reject-all-handler";

        function apply(e) {
          setTimeout(function () {
            if (typeof window.speRewrite === "function") {
              window.speRewrite(e);
            } else {
              console.warn("[OneTrust] speRewrite is not defined");
            }
          }, 250);
        }

        function watch() {
          var e = document.getElementById(id);
          if (e) return apply(e);
          var timer;
          var observer = new MutationObserver(function () {
            var found = document.getElementById(id);
            if (!found) return;
            observer.disconnect();
            clearTimeout(timer);
            apply(found);
          });

          observer.observe(document.body, { childList: true, subtree: true });
          timer = setTimeout(function () { observer.disconnect(); }, 10000);
        }

        if (document.body) {
          watch();
        } else {
          document.addEventListener("DOMContentLoaded", watch);
        }
      }
         
      // Google Consent Mode V2
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'security_storage': 'granted',
        'analytics_storage': 'denied',
        'ad_personalization': 'denied',
        'functionality_storage': 'denied',
        'personalization_storage': 'denied',
        'wait_for_update': 500
      });
      gtag('js', new Date());
    </script>
